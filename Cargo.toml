[package]
name = "loopdiff"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ali Aliyev <ali@aliev.me>"]
description = "A fast GitHub-like terminal diff review loop for humans and AI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aliev/loopdiff"
homepage = "https://github.com/aliev/loopdiff"
keywords = ["diff", "review", "terminal", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/", "/AGENTS.md", "/docs/assets/"]

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
yaml_serde = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"
